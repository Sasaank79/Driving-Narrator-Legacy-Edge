name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy opencv-python-headless ultralytics openvino
    
    - name: Run tests (unit tests only)
      run: |
        # Run only unit tests, skip integration tests that require models
        pytest tests/ -v -k "not Integration" --tb=short
    
    - name: Lint check (optional)
      continue-on-error: true
      run: |
        pip install ruff
        ruff check src/ --ignore=E501
